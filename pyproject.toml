[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-pr-sentinel"
version = "0.2.1"
description = "Automated pull request triage, static security scanning, and AI code review for open-source maintainers."
readme = "README.md"
authors = [{ name = "Farshad Zare", email = "farshadlight98@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sentinel = "src.sentinel:main"
